name: Monthly trial-literature discovery

# 1st of each month, 13:00 UTC (~8am America/Chicago). Also runnable on demand.
on:
  schedule:
    - cron: "0 13 1 * *"
  workflow_dispatch:
    inputs:
      threshold:
        description: "Minimum confidence to auto-add (LOW/MEDIUM/HIGH)"
        default: "MEDIUM"
        required: false
      lookback_days:
        description: "Only consider papers indexed in the last N days (0 = full scan)"
        default: "0"
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Gate: the offline selftest must pass, so a bad scorer edit can't produce a bad PR.
      - name: Selftest (offline, no network)
        run: python discover_updates.py --selftest

      - name: Compute run stamp and monthly branch
        id: meta
        run: |
          echo "stamp=$(date -u '+%Y-%m-%d %H:%M UTC') (run ${GITHUB_RUN_ID})" >> "$GITHUB_OUTPUT"
          echo "branch=auto/trial-update-$(date -u '+%Y-%m')" >> "$GITHUB_OUTPUT"

      - name: Run discovery
        env:
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          NCBI_EMAIL: ${{ secrets.NCBI_EMAIL }}
          RUN_STAMP: ${{ steps.meta.outputs.stamp }}
        run: |
          python discover_updates.py \
            --files trials.json trials_tricuspid.json \
            --threshold "${{ github.event.inputs.threshold || 'MEDIUM' }}" \
            --lookback-days "${{ github.event.inputs.lookback_days || '0' }}" \
            --report discovery_report.md

      # A PR every run: the report always changes (it carries the run stamp), so there is
      # always a diff on the dated branch -> a PR is always opened/updated for you to review.
      - name: Open / update the review PR
        uses: peter-evans/create-pull-request@v6
        with:
          branch: ${{ steps.meta.outputs.branch }}
          base: main
          title: "Trial-literature update — ${{ steps.meta.outputs.stamp }}"
          body-path: discovery_report.md
          commit-message: "chore: monthly discovery — papers, status flips, NCT fixes"
          labels: trial-update, automated
          reviewers: JayMan29
          assignees: JayMan29
          add-paths: |
            trials.json
            trials_tricuspid.json
            discovery_report.md
